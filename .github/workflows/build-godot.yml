name: Build Thor RPG Pixel Art Android APK
on:
  push:
    branches: [godot-prototype-v0.1, experiment-rpg-core-v0.2]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Fetch uploaded pixel art project from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: art-source
      - name: Install pixel art Godot project
        shell: bash
        run: |
          set -euo pipefail
          unzip -o -q art-source/ThorRPG_Art_Prototype_v01.zip 'godot/main.gd' 'godot/main.tscn' 'godot/assets/*' -d .
          test -f godot/assets/player_0_0.png
          test -f godot/assets/goblin.png
          test -f godot/main.gd
          echo 'Pixel art assets and game script installed'

      - name: Repair pixel art loading and character creation
        shell: bash
        run: |
          set -euo pipefail
          python3 godot/ci_integrate_rpg.py
          python3 godot/ci_responsive_world.py
          python3 godot/ci_v05_equipment_ui.py
          python3 godot/ci_v06_forest.py
          python3 godot/ci_v06_feedback.py
          test -f godot/assets/player_0_0.png
          test -f godot/assets/goblin.png
      - name: Install Godot 4.4.1 and Android export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install /tmp/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.4.1.stable
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* ~/.local/share/godot/export_templates/4.4.1.stable/
      - name: Configure Android SDK and debug signing
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          mkdir -p ~/.android
          keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          sed -i "s|keystore/debug=\"\"|keystore/debug=\"$HOME/.android/debug.keystore\"|" godot/export_presets.cfg
          sed -i 's|keystore/debug_user=""|keystore/debug_user="androiddebugkey"|' godot/export_presets.cfg
          sed -i 's|keystore/debug_password=""|keystore/debug_password="android"|' godot/export_presets.cfg
      - name: Import project and export debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd godot
          mkdir -p build
          godot --headless --path . --editor --import --quit
          echo '=== Android editor settings ==='
          cat ~/.config/godot/editor_settings-4.4.tres | grep -E 'android_sdk_path|java_sdk_path' || true
          echo '=== export preset ==='
          tail -n 18 export_presets.cfg
          godot --headless --path . --editor --script res://ci_diagnose.gd
          echo '=== export templates files ==='
          ls -lh ~/.local/share/godot/export_templates/4.4.1.stable | head -25
          echo '=== debug keystore ==='
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey
          echo '=== Android tools ==='
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" version
          echo '=== Godot project parse ==='
          godot --headless --path . --check-only --script res://experiment_v02.gd
          echo '=== Android preset header ==='
          head -n 30 export_presets.cfg
          echo '=== Android export environment ==='
          printf 'ANDROID_HOME=%s\nJAVA_HOME=%s\n' "$ANDROID_HOME" "$JAVA_HOME"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -f "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"
          test -f "$HOME/.android/debug.keystore"
          echo '=== Runtime smoke test ==='
          godot --headless --path . --quit-after 2
          echo '=== Export preset diagnostics ==='
          godot --headless --path . --editor --quit || true
          echo '=== Android export ==='
          godot --headless --verbose --path . --export-debug Android build/ThorRPG-PixelArt-v0.6-debug.apk
          test -s build/ThorRPG-PixelArt-v0.6-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/ThorRPG-PixelArt-v0.6-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ThorRPG-PixelArt-v0.6-APK
          path: godot/build/ThorRPG-PixelArt-v0.6-debug.apk
          if-no-files-found: error
